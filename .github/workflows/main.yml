name: Build SVZ-Mobs

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar dependencias SVZ-Core y SVZ-Items
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p libs
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/kenjiber/svz/releases/download/V1.0.0/svz-core-1.0.0.jar" \
            -o libs/svz-core-1.0.0.jar
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/kenjiber/svz/releases/download/SVZ-items/svz-items-1.0.0.jar" \
            -o libs/svz-items-1.0.0.jar
          test -s libs/svz-core-1.0.0.jar
          test -s libs/svz-items-1.0.0.jar
          file libs/*.jar

      - name: Compilar mod
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Publicar JAR compilado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: svz-mobs-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Guardar informe de error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: svz-mobs-build-logs
          path: |
            build/reports/**
            build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
          
