name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Loom 1.14.10 requiere Gradle 9.2.0 o superior.
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Detectar carpeta del proyecto Gradle
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          find_settings() {
            find . -maxdepth 5 \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.git/*' \
              -not -path '*/.gradle/*' \
              -print -quit
          }

          FOUND="$(find_settings)"

          if [ -z "$FOUND" ]; then
            ZIP="$(find . -maxdepth 2 -iname '*.zip' \
              -not -path '*/.git/*' -print -quit)"

            if [ -n "$ZIP" ]; then
              echo "No se encontró settings.gradle. Extrayendo $ZIP..."
              unzip -q "$ZIP" -d .
              FOUND="$(find_settings)"
            fi
          fi

          if [ -z "$FOUND" ]; then
            echo "::error::No se encontró settings.gradle ni settings.gradle.kts."
            find . -maxdepth 3 -not -path '*/.git/*' -print
            exit 1
          fi

          DIR="$(dirname "$FOUND")"
          DIR="${DIR#./}"

          if [ "$DIR" = "." ]; then
            DIR="."
          fi

          echo "Proyecto encontrado: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Diagnóstico del entorno
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          echo "=== Java ==="
          java -version

          echo "=== Gradle ==="
          gradle --version

          echo "=== Archivos del proyecto ==="
          ls -la

          echo "=== gradle.properties ==="
          cat gradle.properties 2>/dev/null || true

          echo "=== settings.gradle ==="
          cat settings.gradle 2>/dev/null || \
            cat settings.gradle.kts 2>/dev/null || true

          echo "=== build.gradle ==="
          cat build.gradle 2>/dev/null || \
            cat build.gradle.kts 2>/dev/null || true

          echo "=== Wrapper, si existe ==="
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            cat gradle/wrapper/gradle-wrapper.properties
          else
            echo "No hay Gradle Wrapper."
          fi

      - name: Compilar con Gradle
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace --info 2>&1 \
            | tee gradle-build.log

      - name: Subir JAR del mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: thestalker-jar
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Subir reportes y logs si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/gradle-build.log
            **/build/reports/**
            **/build/tmp/**
          if-no-files-found: ignore
