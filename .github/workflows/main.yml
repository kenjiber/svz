name: Build SVZ-Mobs

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Detectar carpeta del proyecto
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$GITHUB_WORKSPACE/settings.gradle" || -f "$GITHUB_WORKSPACE/settings.gradle.kts" ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            SETTINGS_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 5 \( -name settings.gradle -o -name settings.gradle.kts \) -type f -print -quit)"
            if [[ -z "$SETTINGS_FILE" ]]; then
              echo "ERROR: No se encontró settings.gradle ni settings.gradle.kts. Verifica que subiste el contenido del ZIP al repositorio." >&2
              echo "Archivos en la raíz:" >&2
              ls -la "$GITHUB_WORKSPACE" >&2
              exit 1
            fi
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Proyecto encontrado en: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar caché de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar dependencias SVZ-Core y SVZ-Items
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p libs
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/kenjiber/svz/releases/download/V1.0.0/svz-core-1.0.0.jar" \
            -o libs/svz-core-1.0.0.jar
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/kenjiber/svz/releases/download/SVZ-items/svz-items-1.0.0.jar" \
            -o libs/svz-items-1.0.0.jar
          test -s libs/svz-core-1.0.0.jar
          test -s libs/svz-items-1.0.0.jar
          file libs/*.jar

      - name: Compilar mod
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Publicar JAR compilado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: svz-mobs-jar
          path: ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Guardar informe de error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: svz-mobs-build-logs
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
          
