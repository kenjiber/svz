name: Build SVZ-Mobs

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CORE_REPO: kenjiber/svz
  CORE_TAG: V1.0.0
  CORE_JAR: svz-core-1.0.0.jar

  ITEMS_REPO: kenjiber/svz
  ITEMS_TAG: SVZ-items
  ITEMS_JAR: svz-items-1.0.0.jar

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio SVZ-Mobs
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Detectar carpeta del proyecto Gradle
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          find_settings() {
            find . -maxdepth 5 \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.git/*' \
              -not -path '*/.gradle/*' \
              -print -quit
          }

          FOUND="$(find_settings)"

          if [ -z "$FOUND" ]; then
            ZIP="$(find . -maxdepth 2 -iname '*.zip' \
              -not -path '*/.git/*' -print -quit)"

            if [ -n "$ZIP" ]; then
              echo "Extrayendo proyecto: $ZIP"
              unzip -q "$ZIP" -d .
              FOUND="$(find_settings)"
            fi
          fi

          if [ -z "$FOUND" ]; then
            echo "::error::No se encontró settings.gradle ni settings.gradle.kts."
            find . -maxdepth 3 -not -path '*/.git/*' -print
            exit 1
          fi

          DIR="$(dirname "$FOUND")"
          echo "Proyecto encontrado: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Descargar SVZ-Core desde GitHub Releases
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p libs

          URL="https://github.com/${CORE_REPO}/releases/download/${CORE_TAG}/${CORE_JAR}"

          echo "Descargando SVZ-Core desde:"
          echo "$URL"

          curl --fail --location --silent --show-error \
            "$URL" --output "libs/${CORE_JAR}"

          if [ ! -s "libs/${CORE_JAR}" ]; then
            echo "::error::El JAR de SVZ-Core está vacío o no se descargó."
            exit 1
          fi

          echo "SVZ-Core descargado correctamente:"
          ls -lh "libs/${CORE_JAR}"

      - name: Descargar SVZ-Items desde GitHub Releases
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p libs

          URL="https://github.com/${ITEMS_REPO}/releases/download/${ITEMS_TAG}/${ITEMS_JAR}"

          echo "Descargando SVZ-Items desde:"
          echo "$URL"

          curl --fail --location --silent --show-error \
            "$URL" --output "libs/${ITEMS_JAR}"

          if [ ! -s "libs/${ITEMS_JAR}" ]; then
            echo "::error::El JAR de SVZ-Items está vacío o no se descargó."
            exit 1
          fi

          echo "SVZ-Items descargado correctamente:"
          ls -lh "libs/${ITEMS_JAR}"

      - name: Diagnóstico del entorno y dependencias
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Java ==="
          java -version

          echo "=== Gradle ==="
          gradle --version

          echo "=== Archivos del proyecto ==="
          ls -la

          echo "=== Dependencias declaradas ==="
          grep -n -E 'svz-core|svz-items|svzcore|libs' \
            build.gradle build.gradle.kts 2>/dev/null || true

          echo "=== JAR descargados ==="
          ls -lh libs/

          test -s "libs/${CORE_JAR}"
          test -s "libs/${ITEMS_JAR}"

      - name: Compilar SVZ-Mobs
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace --info 2>&1 \
            | tee gradle-build.log

      - name: Subir JAR de SVZ-Mobs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: svz-mobs-jar
          path: |
            ${{ steps.locate.outputs.dir }}/build/libs/*.jar
            !${{ steps.locate.outputs.dir }}/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Subir reportes y logs si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: svz-mobs-build-reports
          path: |
            **/gradle-build.log
            **/build/reports/**
            **/build/tmp/**
          if-no-files-found: ignore
