name: Build SVZ-Mobs

on:
  workflow_dispatch:
  push:
    paths:
      - "svz-mobs.zip"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verificar y extraer el proyecto
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "svz-mobs.zip" ]; then
            echo "ERROR: No existe svz-mobs.zip en la raíz del repositorio."
            ls -la
            exit 1
          fi

          mkdir -p extracted-project
          unzip -oq svz-mobs.zip -d extracted-project

          SETTINGS_FILE="$(find extracted-project -type f -name 'settings.gradle*' -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: El ZIP no contiene settings.gradle ni settings.gradle.kts."
            find extracted-project -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto detectado en: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Descargar dependencias SVZ-Core y SVZ-Items
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_DIR/libs"
          curl --fail --location --retry 3 \
            "https://github.com/kenjiber/svz/releases/download/V1.0.0/svz-core-1.0.0.jar" \
            -o "$PROJECT_DIR/libs/svz-core-1.0.0.jar"
          curl --fail --location --retry 3 \
            "https://github.com/kenjiber/svz/releases/download/SVZ-items/svz-items-1.0.0.jar" \
            -o "$PROJECT_DIR/libs/svz-items-1.0.0.jar"
          test -s "$PROJECT_DIR/libs/svz-core-1.0.0.jar"
          test -s "$PROJECT_DIR/libs/svz-items-1.0.0.jar"
          file "$PROJECT_DIR/libs/"*.jar

      - name: Compilar SVZ-Mobs
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          # ⚠️ CLAVE: dar permisos ANTES de usar el wrapper
          chmod +x ./gradlew
          ./gradlew wrapper --gradle-version 9.2.0
          ./gradlew build --no-daemon --stacktrace --no-configuration-cache

      - name: Subir JAR compilado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: svz-mobs-jar
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Guardar registros si falla la compilación
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: svz-mobs-build-logs
          path: |
            extracted-project/**/build/reports/**
            extracted-project/**/build/*.log
          if-no-files-found: ignore
          retention-days: 7
