name: Build SVZ-Core

on:
  workflow_dispatch:
  push:
    paths:
      - "svz-core.zip"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verificar y extraer el proyecto
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "svz-core.zip" ]; then
            echo "ERROR: No existe svz-core.zip en la raíz del repositorio."
            ls -la
            exit 1
          fi

          mkdir -p extracted-project
          unzip -oq svz-core.zip -d extracted-project

          SETTINGS_FILE="$(find extracted-project -type f -name 'settings.gradle*' -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: El ZIP no contiene settings.gradle ni settings.gradle.kts."
            find extracted-project -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto detectado en: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Compilar SVZ-Core
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace --no-configuration-cache

      - name: Subir JAR compilado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: svz-core-jar
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Guardar registros si falla la compilación
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: svz-core-build-logs
          path: |
            extracted-project/**/build/reports/**
            extracted-project/**/build/*.log
          if-no-files-found: ignore
          retention-days: 7
